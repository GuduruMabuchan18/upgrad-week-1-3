<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile Card</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        .card {
            width: 320px;
            margin: 60px auto;
            padding: 20px;
            background-color: #ffffff;
            border: 2px solid #cccccc;
            border-radius: 10px;
            text-align: center;
        }

        .card h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .role {
            margin: 8px 0;
            font-size: 16px;
            font-weight: 600;
            color: #555555;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
            margin: 15px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            background-color: #007bff;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>John Doe</h1>
        <div class="role">Frontend Developer</div>
        <p class="description">
            Passionate web developer with a strong interest in building clean,
            responsive, and user-friendly interfaces using modern web technologies.
        </p>
        <a href="#" class="btn">Contact Me</a>
    </div>

</body>
</html>
