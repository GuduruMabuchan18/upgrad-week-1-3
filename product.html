<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Features</title>

    <style>
        /* Element selector */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* Class selector */
        .feature-section {
            width: 70%;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
        }

        .feature-section h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Descendant selector */
        .feature-section ul {
            list-style: none;
            padding: 0;
        }

        .feature-section ul li {
            background-color: #eef2f7;
            color: #34495e;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #d0d7e2;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        /* Hover effect */
        .feature-section ul li:hover {
            background-color: #3498db;
            color: #ffffff;
            cursor: pointer;
            transform: translateX(5px);
        }
    </style>
</head>

<body>

    <section class="feature-section">
        <h2>Key Product Features</h2>

        <ul>
            <li>Fast and reliable performance</li>
            <li>User-friendly interface</li>
            <li>Secure data protection</li>
            <li>Responsive design for all devices</li>
            <li>Easy customization options</li>
        </ul>
    </section>

</body>
</html>
